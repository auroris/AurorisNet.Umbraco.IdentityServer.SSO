name: Release

run-name: Release ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.2.3 or 1.2.3-rc.1, with or without a v prefix
        required: true
        type: string
      dry-run:
        description: Test and pack only, and keep the package as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  release:
    name: Test and publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_ID: AurorisNet.Umbraco.IdentityServer.SSO
      PACKAGE_PROJECT: src/AurorisNet.Umbraco.IdentityServer.SSO.csproj
      TEST_PROJECT: tests/IdentityServer.Sso.Tests
      # Makes the build deterministic and, with Directory.Build.props, turns its warnings into errors.
      ContinuousIntegrationBuild: 'true'
      # Build against the published identity server, which the package then depends on, instead of a sibling checkout.
      UseIdentityServerSource: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # global.json keeps the build on a .NET 10 SDK, whichever other SDKs the runner has.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # A version is published once. A tag that already points at this commit belongs to an earlier attempt of the same
      # release, which this run finishes; a tag on another commit means the version is taken.
      - name: Check the version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ($version -cnotmatch "\A$number\.$number\.$number(-$identifier(\.$identifier)*)?\z") {
            throw 'Use MAJOR.MINOR.PATCH, optionally followed by a prerelease such as -rc.1. Build metadata is not supported.'
          }
          foreach ($component in $version.Split('-', 2)[0].Split('.')) {
            if ($component.Length -gt 5 -or [int]$component -gt 65534) {
              throw '.NET assembly version components must be between 0 and 65534.'
            }
          }
          if ($env:DRY_RUN -ne 'true' -and $env:RELEASE_REF -ne 'refs/heads/main') {
            throw 'Publish from main. Other branches can run a dry run.'
          }
          $tag = "v$version"
          $existing = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tags.' }
          if ($existing) {
            $tagged = git rev-list -n 1 $tag
            if ($tagged -ne $env:RELEASE_COMMIT) { throw "Tag $tag already exists on another commit. Choose a new version." }
            Write-Host "Tag $tag already points at this commit; finishing that release."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # The tests boot real Umbraco sites with SQLite, so nothing outside the runner is needed.
      - name: Test
        run: |
          dotnet test --project "$env:TEST_PROJECT" -c Release
          if ($LASTEXITCODE -ne 0) { throw 'The tests failed.' }

      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack "$env:PACKAGE_PROJECT" -c Release -p:Version=$env:RELEASE_VERSION -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Could not pack the package.' }

      # A dry run ends here, with the package a release of this commit would publish. Nothing is tagged or published.
      - name: Keep the package of a dry run
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.run_id }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      # Reserve the tag before publishing, so a retried run reuses it and no other run can claim the version.
      - name: Reserve the release tag
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $existing = git tag --list "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
          if (!$existing) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:RELEASE_COMMIT"
            if ($LASTEXITCODE -ne 0) { throw "Could not reserve the release tag $env:RELEASE_TAG." }
          }

      - name: Log in to NuGet with trusted publishing
        if: ${{ !inputs.dry-run }}
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: AurorisNet

      - name: Publish to NuGet
        if: ${{ !inputs.dry-run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet nuget push "artifacts/packages/$env:PACKAGE_ID.$env:RELEASE_VERSION.nupkg" `
            --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $env:RELEASE_VERSION to NuGet." }

      # A retried run uploads the package again to the release an earlier attempt created.
      - name: Publish the GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $package = "artifacts/packages/$env:PACKAGE_ID.$env:RELEASE_VERSION.nupkg"
          gh release view "$env:RELEASE_TAG" --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$package" --clobber
          } else {
            $create = @('release', 'create', $env:RELEASE_TAG, $package, '--verify-tag', '--title', $env:RELEASE_VERSION, '--generate-notes')
            if ($env:RELEASE_PRERELEASE -eq 'true') { $create += '--prerelease' }
            # gh places these notes above the generated ones.
            if ($env:RELEASE_NOTES) { $create += @('--notes', $env:RELEASE_NOTES) }
            gh @create
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the GitHub release $env:RELEASE_TAG." }
