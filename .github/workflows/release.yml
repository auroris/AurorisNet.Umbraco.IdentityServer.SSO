name: Release

run-name: Release ${{ inputs.version || format('(next {0})', inputs.bump) }}${{ inputs.dry-run && ' (dry run)' || '' }}

# Publishes the package to nuget.org and GitHub. Starts by hand, or from the Weekly release workflow when
# a new release of a dependency has been merged. The shared steps come from auroris/AurorisNet.Build, whose
# docs/releasing.md describes them. nuget.org trusts this file by its name, so keep it release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.2.3 or 1.2.3-rc.1. Leave empty to raise the newest release tag.
        required: false
        type: string
      bump:
        description: Which part of the newest stable tag to raise when the version is empty
        type: choice
        default: patch
        options:
          - patch
          - minor
      test:
        description: Run the tests before publishing.
        type: boolean
        default: true
      dry-run:
        description: Test and pack only, and keep the package as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  release:
    name: Test and publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_PROJECT: src/AurorisNet.Umbraco.IdentityServer.SSO.csproj
      TEST_PROJECT: tests/IdentityServer.Sso.Tests
      # Makes the build deterministic and, with Directory.Build.props, turns its warnings into errors.
      ContinuousIntegrationBuild: 'true'
      # Build against the published IdentityServer package, which the package then depends on, instead of a sibling checkout.
      UseIdentityServerSource: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # global.json keeps the build on a .NET 10 SDK, whichever other SDKs the runner has.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Choose the version
        id: version
        uses: auroris/AurorisNet.Build/actions/version@main
        with:
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}

      # The tests boot a real Umbraco site with SQLite, on the newest supported release. Other releases are tested on a
      # developer's machine, as the README's Developing section describes.
      - name: Test
        if: ${{ inputs.test }}
        run: |
          dotnet test --project "$env:TEST_PROJECT" -c Release
          if ($LASTEXITCODE -ne 0) { throw 'The tests failed.' }

      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack "$env:PACKAGE_PROJECT" -c Release "-p:Version=$env:RELEASE_VERSION" -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Could not pack the package.' }

      - name: Publish
        uses: auroris/AurorisNet.Build/actions/publish@main
        with:
          versions: ${{ steps.version.outputs.versions }}
          dry-run: ${{ inputs.dry-run }}
          notes: ${{ inputs.notes }}
