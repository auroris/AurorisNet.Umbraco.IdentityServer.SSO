# Dependabot opens the pull requests that .github/workflows/ci.yml tests and merges. An update of a package the project
# under src references, such as the IdentityServer package, then starts the Release workflow. The New Umbraco releases
# workflow follows Umbraco itself, so Dependabot leaves the Umbraco packages alone. The workflows pin each action to a
# commit; Dependabot updates the commit and the version in the comment beside it.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: "Umbraco.*"
    groups:
      # The IdentityServer packages are the second dependency the package follows. They get a pull request of their own,
      # so each of their releases becomes a release of this package.
      identityserver:
        patterns:
          - "AurorisNet.*"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "AurorisNet.*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
